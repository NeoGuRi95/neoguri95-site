    @keyframes tap { 0%, 49%, 100% { transform: translateY(0); } 25% { transform: translateY(5px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .paw-left, .paw-right, .cursor { animation: none; }
    }

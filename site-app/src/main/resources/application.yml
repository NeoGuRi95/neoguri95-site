server:
  port: 8080

spring:
  application:
    name: site-app
  datasource:
    url: ${SITE_DB_URL}
    username: ${SITE_DB_USER}
    password: ${SITE_DB_PASSWORD}
  flyway:
    user: ${SITE_FLYWAY_USER:${spring.datasource.username}}
    password: ${SITE_FLYWAY_PASSWORD:${spring.datasource.password}}

site:
  admin-token: ${SITE_ADMIN_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('구독 해지 — neoguri95')}">
  <title>구독 해지 — neoguri95</title>
</head>
<body>
<div class="page">
  <header th:replace="~{fragments :: header}"></header>
  <nav th:replace="~{fragments :: tabs('none')}"></nav>

  <main class="card-main">
    <div class="action-card">
      <img class="card-face" th:src="@{/images/raccoon-face.svg}" src="/images/raccoon-face.svg" alt="" width="64" height="44">
      <p class="kicker">UNSUBSCRIBE</p>
      <h1>새 글 알림을<br>해지할까요?</h1>
      <p>버튼을 누르면 더 이상 새 글 알림 메일을 보내지 않습니다.</p>
      <form th:action="@{/subscriptions/unsubscribe}" action="/subscriptions/unsubscribe" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <button class="button-outline" type="submit">구독 해지하기</button>
      </form>
      <a class="secondary-link" th:href="@{/}" href="/">계속 구독할게요</a>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('구독 확인 — neoguri95')}">
  <title>구독 확인 — neoguri95</title>
</head>
<body>
<div class="page">
  <header th:replace="~{fragments :: header}"></header>
  <nav th:replace="~{fragments :: tabs('none')}"></nav>

  <main class="card-main">
    <div class="action-card">
      <img class="card-face" th:src="@{/images/raccoon-face.svg}" src="/images/raccoon-face.svg" alt="" width="64" height="44">
      <p class="kicker">ONE MORE STEP</p>
      <h1>새 글 알림을<br>구독할까요?</h1>
      <p>버튼을 누르면 구독이 완료됩니다. 새로운 글이 올라오면 메일로 알려드릴게요.</p>
      <form th:action="@{/subscriptions/confirm}" action="/subscriptions/confirm" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="field" th:if="${email}">
          <label for="confirm-email">구독할 이메일</label>
          <input id="confirm-email" type="email" th:value="${email}" value="hello@example.com" readonly>
        </div>
        <button class="button-accent button-block" type="submit">구독하기</button>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>neoguri95</title></head>
<body>
  <main>
    <h1>neoguri95</h1>
    <p>새 글을 이메일로 받아보세요.</p>
    <form action="/subscriptions" method="post">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <button type="submit">새 글 알림 구독</button>
    </form>
    <p th:if="${param.subscription}">확인 메일을 보냈습니다. 메일의 링크를 눌러 구독을 완료해 주세요.</p>
    <h2>글</h2>
    <ul><li th:each="post : ${posts}"><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">글 제목</a></li></ul>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('neoguri95')}">
  <title>neoguri95</title>
</head>
<body>
<div class="page" id="top">
  <header th:replace="~{fragments :: header}"></header>
  <nav th:replace="~{fragments :: tabs('home')}"></nav>

  <div class="container home-layout">
    <aside class="sidebar" aria-label="소개와 구독">
      <section class="intro" aria-labelledby="hero-title">
        <div class="hero-image">
          <img th:src="@{/images/hero-scene.svg}" src="/images/hero-scene.svg"
               alt="비가 내리는 도시 야경이 보이는 창가 방에서 헤드셋을 쓰고 FPS 게임을 하는 너구리의 뒷모습" width="320" height="240">
        </div>
        <h1 id="hero-title">안녕하세요, 너구리입니다.</h1>
        <p>일상을 기록합니다.</p>
        <div class="link-list">
          <a href="https://neoguri95.github.io/" target="_blank" rel="noopener">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3"/><path d="M16 9l4 3-4 3"/><path d="M13.5 6l-3 12"/></svg>
            <span>개발 블로그</span>
          </a>
        </div>
      </section>

      <section id="subscribe" aria-labelledby="subscribe-title">
        <div class="section-title-row">
          <h2 class="section-title" id="subscribe-title">새 글 알림 받기</h2>
          <a th:href="@{/subscriptions/unsubscribe-request}" href="/subscriptions/unsubscribe-request">해지하기</a>
        </div>
        <p class="section-desc">새 글이 올라오면 이메일로 알려드릴게요. 확인 메일의 링크를 누르면 구독이 완료되고, 언제든 해지할 수 있어요.</p>
        <form th:action="@{/subscriptions}" action="/subscriptions" method="post">
          <label class="sr-only" for="email">이메일 주소</label>
          <div class="inline-form">
            <input id="email" name="email" type="email" placeholder="이메일 주소" required autocomplete="email">
            <button type="submit">구독</button>
          </div>
        </form>
        <p class="form-status" role="status" th:if="${param.subscription}">확인 메일을 보냈어요. 메일의 링크를 눌러 구독을 완료해 주세요.</p>
      </section>
    </aside>

    <main class="feed" id="posts">
      <p class="empty" th:if="${#lists.isEmpty(posts)}">첫 글을 준비하고 있어요.</p>

      <th:block th:unless="${#lists.isEmpty(posts)}">
        <div class="feature-row">
          <a class="featured" th:with="latest=${posts[0]}" th:href="@{/posts/{id}(id=${latest.id})}">
            <span class="featured-label">LATEST</span>
            <span class="featured-title" th:text="${latest.title}">가장 최근 글 제목</span>
            <span class="excerpt" th:text="${latest.excerpt}">글 요약</span>
            <time class="meta" th:attr="datetime=${#dates.format(latest.publishedAt, 'yyyy-MM-dd')}"
                  th:text="${#dates.format(latest.publishedAt, 'yyyy.MM.dd')}">2026.11.04</time>
          </a>

          <th:block th:if="${#lists.size(posts) > 1}">
            <div class="feature-divider" aria-hidden="true"></div>
            <ul class="recent-list" aria-label="최근 글">
              <li th:each="post, stat : ${posts}" th:if="${stat.index >= 1 and stat.index <= 4}">
                <a th:href="@{/posts/{id}(id=${post.id})}">
                  <span class="recent-title" th:text="${post.title}">글 제목</span>
                  <span class="excerpt" th:text="${post.excerpt}">글 요약</span>
                  <time class="meta" th:attr="datetime=${#dates.format(post.publishedAt, 'yyyy-MM-dd')}"
                        th:text="${#dates.format(post.publishedAt, 'yyyy.MM.dd')}">2026.10.28</time>
                </a>
              </li>
            </ul>
          </th:block>
        </div>

        <section aria-labelledby="archive-title" th:if="${#lists.size(posts) > 5}">
          <div class="section-head">
            <h2 id="archive-title">지난 글</h2>
          </div>
          <ul class="archive-list">
            <li th:each="post, stat : ${posts}" th:if="${stat.index >= 5}">
              <a th:href="@{/posts/{id}(id=${post.id})}">
                <span class="recent-title" th:text="${post.title}">글 제목</span>
                <time class="meta" th:attr="datetime=${#dates.format(post.publishedAt, 'yyyy-MM-dd')}"
                      th:text="${#dates.format(post.publishedAt, 'yyyy.MM.dd')}">2026.10.01</time>
              </a>
            </li>
          </ul>
        </section>
      </th:block>
    </main>
  </div>

  <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>

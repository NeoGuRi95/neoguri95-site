name: neoguri95-site

services:
  postgres:
    image: postgres:18
    container_name: neoguri95-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # 릴레이가 멈춰도 슬롯이 WAL을 무한정 붙잡지 못하게 상한을 둔다
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql

  flyway-bootstrap:
    image: flyway/flyway:13.10.3
    depends_on:
      postgres:
        condition: service_started
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./infra/flyway/bootstrap:/flyway/sql:ro
    command: migrate

  kafka:
    image: apache/kafka:4.3.2
    container_name: neoguri95-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092",
                 "--create", "--if-not-exists", "--topic", "site-events", "--partitions", "1", "--replication-factor", "1"]

  connect:
    image: quay.io/debezium/connect:3.7
    container_name: neoguri95-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: neoguri95-connect
      CONFIG_STORAGE_TOPIC: neoguri95_connect_configs
      OFFSET_STORAGE_TOPIC: neoguri95_connect_offsets
      STATUS_STORAGE_TOPIC: neoguri95_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

  connector-init:
    image: curlimages/curl:8.16.0
    depends_on:
      connect:
        condition: service_started
    volumes:
      - ./infra/debezium/site-outbox.json:/connector.json:ro
    entrypoint: ["sh", "-c"]
    command: ["curl --fail --retry 20 --retry-delay 2 --retry-connrefused -X PUT -H 'Content-Type: application/json' --data-binary @/connector.json http://connect:8083/connectors/site-outbox/config"]

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: neoguri95-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
